# nginx proxy address - http://172.17.0.1:64358

name: strapi
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: naskio/strapi:latest
    container_name: strapi-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      HOST: ${STRAPI_HOST:-0.0.0.0}
      PORT: ${STRAPI_PORT:-1337}
      APP_KEYS: ${APP_SECRET_KEY:-replace-with-a-random-app-key}
      API_TOKEN_SALT: ${APP_SECRET_TOKEN_32:-replace-with-a-random-api-token-salt}
      ADMIN_JWT_SECRET: ${APP_JWT_TOKEN:-replace-with-a-random-jwt-secret}
      TRANSFER_TOKEN_SALT: ${ENCRYPTION_KEY:-replace-with-a-random-transfer-salt}
      DATABASE_CLIENT: ${DATABASE_CLIENT:-sqlite}
      NODE_ENV: ${STRAPI_NODE_ENV:-development}
      CONTAINER_NAME: strapi-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:1337/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64358:1337'
    volumes:
      - './volumes/data/strapi:/srv/app'
    networks:
      - strapi

networks:
  strapi:
    name: strapi
    external: false
